<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MysteryOps — Pokémon Box Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0e12;
  --bg2: #13151c;
  --bg3: #1a1d27;
  --surface: #1f2232;
  --surface2: #262a3d;
  --border: #2e3350;
  --border2: #3a4060;
  --accent: #ffcb05;
  --accent2: #ffe566;
  --accent-dim: rgba(255,203,5,0.12);
  --teal: #00d4aa;
  --teal-dim: rgba(0,212,170,0.12);
  --purple: #9b6dff;
  --purple-dim: rgba(155,109,255,0.12);
  --yellow: #ffd166;
  --yellow-dim: rgba(255,209,102,0.12);
  --red: #ff4757;
  --red-dim: rgba(255,71,87,0.12);
  --green: #2ed573;
  --green-dim: rgba(46,213,115,0.12);
  --blue: #3d9bff;
  --blue-dim: rgba(61,155,255,0.12);
  --text: #e8eaf0;
  --text2: #9fa3b8;
  --text3: #5f6480;
  --mono: 'Space Mono', monospace;
  --sans: 'Syne', sans-serif;
  --radius: 8px;
  --radius2: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow2: 0 8px 40px rgba(0,0,0,0.6);
  --starter-color: #2ed573;
  --starter-dim: rgba(46,213,115,0.13);
  --deluxe-color: #ffd166;
  --deluxe-dim: rgba(255,209,102,0.13);
  --premium-color: #3d9bff;
  --premium-dim: rgba(61,155,255,0.13);
  --collector-color: #9b6dff;
  --collector-dim: rgba(155,109,255,0.13);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; scroll-behavior: smooth; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
button { font-family: var(--sans); cursor: pointer; border: none; outline: none; }
input, select, textarea { font-family: var(--sans); outline: none; }
a { text-decoration: none; color: inherit; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.app { display: flex; height: 100vh; overflow: hidden; }

/* SIDEBAR */
.sidebar { width: 224px; min-width: 224px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 100; }
.logo { padding: 18px; border-bottom: 1px solid var(--border); }
.logo-mark { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 34px; height: 34px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.logo-text { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.1; color: var(--text); }
.logo-sub { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; }
.nav { flex: 1; padding: 10px 0; overflow-y: auto; }
.nav-section-label { font-size: 9px; font-family: var(--mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); padding: 12px 18px 5px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 18px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text2); position: relative; transition: all 0.15s; }
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--accent-dim); color: var(--accent); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); border-radius: 0 2px 2px 0; }
.nav-icon { width: 16px; text-align: center; font-size: 14px; }
.box-legend { padding: 10px 18px 14px; border-bottom: 1px solid var(--border); }
.box-legend-label { font-size: 9px; font-family: var(--mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
.box-legend-items { display: flex; flex-direction: column; gap: 5px; }
.box-legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; }
.box-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.sidebar-footer { padding: 12px 18px; border-top: 1px solid var(--border); font-size: 10px; color: var(--text3); font-family: var(--mono); }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.topbar-title { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
.topbar-subtitle { font-size: 11px; color: var(--text3); font-family: var(--mono); }
.topbar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.content { flex: 1; overflow-y: auto; padding: 24px; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-size: 12px; font-weight: 700; letter-spacing: 0.3px; transition: all 0.15s; cursor: pointer; font-family: var(--sans); border: none; }
.btn-primary { background: var(--accent); color: #0d0e12; }
.btn-primary:hover { background: var(--accent2); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,203,5,0.3); }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
.btn-secondary:hover { background: var(--border); }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface); color: var(--text); }
.btn-success { background: var(--green); color: #0d1a0f; }
.btn-success:hover { filter: brightness(1.1); }
.btn-danger { background: var(--red); color: white; }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn-icon { padding: 7px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); color: var(--text2); transition: all 0.15s; font-size: 13px; cursor: pointer; }
.btn-icon:hover { background: var(--surface2); color: var(--text); }
.btn:disabled, button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

/* CARDS */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius2); overflow: hidden; }
.card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card-title { font-size: 14px; font-weight: 700; }
.card-body { padding: 20px; }

/* STATS */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius2); padding: 16px 18px; position: relative; overflow: hidden; transition: border-color 0.2s; }
.stat-card:hover { border-color: var(--border2); }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
.stat-card.c-green::before  { background: var(--starter-color); }
.stat-card.c-yellow::before { background: var(--deluxe-color); }
.stat-card.c-blue::before   { background: var(--premium-color); }
.stat-card.c-purple::before { background: var(--collector-color); }
.stat-card.c-teal::before   { background: var(--teal); }
.stat-card.c-accent::before { background: var(--accent); }
.stat-card.c-red::before    { background: var(--red); }
.stat-label { font-size: 10px; font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 7px; }
.stat-value { font-size: 26px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; font-family: var(--mono); }
.stat-icon { position: absolute; right: 14px; top: 16px; font-size: 22px; opacity: 0.13; }

/* TABLES */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 10px; font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--text3); padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); background: var(--bg2); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg3); }
.td-mono { font-family: var(--mono); font-size: 11px; }

/* BADGES */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; font-family: var(--mono); letter-spacing: 0.5px; text-transform: uppercase; }
.badge-green  { background: var(--green-dim);  color: var(--green); }
.badge-yellow { background: var(--yellow-dim); color: var(--yellow); }
.badge-blue   { background: var(--blue-dim);   color: var(--blue); }
.badge-purple { background: var(--purple-dim); color: var(--purple); }
.badge-teal   { background: var(--teal-dim);   color: var(--teal); }
.badge-red    { background: var(--red-dim);    color: var(--red); }
.badge-gray   { background: var(--surface2);   color: var(--text3); }
.badge-accent { background: var(--accent-dim); color: var(--accent); }

/* BOX TYPE TAG */
.box-type-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-family: var(--mono); font-weight: 700; padding: 3px 9px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
.box-type-starter   { background: var(--starter-dim);   color: var(--starter-color);   border: 1px solid rgba(46,213,115,0.25); }
.box-type-deluxe    { background: var(--deluxe-dim);    color: var(--deluxe-color);    border: 1px solid rgba(255,209,102,0.25); }
.box-type-premium   { background: var(--premium-dim);   color: var(--premium-color);   border: 1px solid rgba(61,155,255,0.25); }
.box-type-collector { background: var(--collector-dim); color: var(--collector-color); border: 1px solid rgba(155,109,255,0.25); }

/* FORMS */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 5px; display: block; letter-spacing: 0.3px; }
.form-control { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; color: var(--text); font-size: 13px; font-family: var(--sans); transition: border-color 0.15s; }
.form-control:focus { border-color: var(--accent); }
.form-control::placeholder { color: var(--text3); }
select.form-control { cursor: pointer; }
textarea.form-control { resize: vertical; min-height: 70px; }
.form-hint { font-size: 10px; color: var(--text3); margin-top: 4px; font-family: var(--mono); }
.form-row { display: grid; gap: 12px; }
.form-row-2 { grid-template-columns: 1fr 1fr; }
.form-row-3 { grid-template-columns: 1fr 1fr 1fr; }

/* SEARCH / FILTER */
.search-bar { display: flex; align-items: center; gap: 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 0 12px; flex: 1; }
.search-bar input { background: none; border: none; color: var(--text); font-size: 13px; font-family: var(--sans); padding: 8px 0; flex: 1; }
.search-bar input::placeholder { color: var(--text3); }
.filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.filter-select { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--text); font-size: 12px; font-family: var(--sans); cursor: pointer; }
.filter-select:focus { border-color: var(--accent); outline: none; }

/* BUILD CAPACITY METERS */
.capacity-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius2); padding: 16px 20px; margin-bottom: 12px; transition: border-color 0.2s; position: relative; overflow: hidden; }
.capacity-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.capacity-card.cap-starter::before   { background: var(--starter-color); }
.capacity-card.cap-deluxe::before    { background: var(--deluxe-color); }
.capacity-card.cap-premium::before   { background: var(--premium-color); }
.capacity-card.cap-collector::before { background: var(--collector-color); }
.capacity-card:hover { border-color: var(--border2); }
.capacity-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.capacity-name { font-size: 14px; font-weight: 800; }
.capacity-meta { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-top: 3px; }
.capacity-count { font-size: 30px; font-weight: 800; font-family: var(--mono); letter-spacing: -1px; text-align: right; }
.capacity-count-label { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; text-align: right; }
.meter-track { height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.meter-fill { height: 100%; border-radius: 4px; transition: width 0.7s cubic-bezier(0.34,1.56,0.64,1); }
.meter-starter   { background: linear-gradient(90deg, #1aad52, var(--starter-color)); }
.meter-deluxe    { background: linear-gradient(90deg, #c99a00, var(--deluxe-color)); }
.meter-premium   { background: linear-gradient(90deg, #1a6fc9, var(--premium-color)); }
.meter-collector { background: linear-gradient(90deg, #6a3fd1, var(--collector-color)); }
.meter-empty     { background: var(--red); }
.capacity-footer { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--text3); font-family: var(--mono); }
.limiting-item { color: var(--yellow); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius2); width: 100%; max-width: 700px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow2); animation: modalIn 0.2s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes modalIn { from { opacity: 0; transform: scale(0.94) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.modal-title { font-size: 15px; font-weight: 800; }
.modal-close { background: var(--surface); border: 1px solid var(--border); color: var(--text2); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.modal-close:hover { background: var(--red-dim); color: var(--red); border-color: var(--red); }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0; }

/* ALERTS */
.alert { padding: 10px 14px; border-radius: var(--radius); font-size: 12px; display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
.alert-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.alert-warn   { background: var(--yellow-dim); border: 1px solid rgba(255,209,102,0.2); color: var(--yellow); }
.alert-danger { background: var(--red-dim);    border: 1px solid rgba(255,71,87,0.2);   color: var(--red); }
.alert-success{ background: var(--green-dim);  border: 1px solid rgba(46,213,115,0.2);  color: var(--green); }
.alert-info   { background: var(--accent-dim); border: 1px solid rgba(255,203,5,0.2);   color: var(--accent); }

/* TABS */
.tabs { display: flex; gap: 2px; padding: 4px; background: var(--bg3); border-radius: var(--radius); margin-bottom: 18px; }
.tab { flex: 1; padding: 7px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; color: var(--text3); cursor: pointer; transition: all 0.15s; text-align: center; background: none; border: none; }
.tab.active { background: var(--surface2); color: var(--text); }
.tab:hover:not(.active) { color: var(--text2); }

/* PREMIUM CONFIG OPTIONS */
.config-options { display: flex; gap: 10px; margin-bottom: 14px; }
.config-option { flex: 1; padding: 12px; border-radius: var(--radius); border: 2px solid var(--border); cursor: pointer; transition: all 0.15s; background: var(--bg3); font-size: 12px; font-weight: 600; text-align: center; }
.config-option:hover { border-color: var(--premium-color); }
.config-option.selected { border-color: var(--premium-color); background: var(--blue-dim); color: var(--blue); }
.config-option .config-label { font-size: 11px; font-family: var(--mono); margin-bottom: 4px; color: var(--text3); font-weight: 700; }
.config-option.selected .config-label { color: var(--blue); }

/* COMPONENT ROWS */
.component-list { display: flex; flex-direction: column; gap: 8px; }
.component-row { display: flex; align-items: center; gap: 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; }
.comp-name { flex: 1; font-size: 12px; font-weight: 600; }
.comp-qty { width: 60px; background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px; color: var(--text); font-size: 12px; font-family: var(--mono); text-align: center; }
.comp-val { font-size: 11px; font-family: var(--mono); color: var(--text3); width: 90px; text-align: right; }
.comp-remove { color: var(--text3); cursor: pointer; transition: color 0.15s; background: none; border: none; font-size: 14px; padding: 0; }
.comp-remove:hover { color: var(--red); }

/* HISTORY */
.log-list { display: flex; flex-direction: column; gap: 8px; }
.log-item { display: flex; gap: 12px; padding: 10px 14px; background: var(--bg3); border-radius: var(--radius); border-left: 3px solid var(--border2); font-size: 12px; }
.log-item.log-add    { border-color: var(--green); }
.log-item.log-remove { border-color: var(--red); }
.log-item.log-approve{ border-color: var(--teal); }
.log-item.log-pack   { border-color: var(--blue); }
.log-time { font-family: var(--mono); font-size: 10px; color: var(--text3); white-space: nowrap; }
.log-msg { flex: 1; color: var(--text2); }

/* MISC */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-title { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
.section-sub { font-size: 11px; color: var(--text3); font-family: var(--mono); }
.stock-indicator { display: flex; align-items: center; gap: 5px; }
.stock-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.stock-dot-green  { background: var(--green); }
.stock-dot-yellow { background: var(--yellow); }
.stock-dot-red    { background: var(--red); }
.sep { height: 1px; background: var(--border); margin: 18px 0; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.scroll-panel { max-height: 300px; overflow-y: auto; padding-right: 4px; }
.empty-state { text-align: center; padding: 48px 24px; color: var(--text3); }
.empty-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.4; }
.empty-title { font-size: 14px; font-weight: 700; color: var(--text2); margin-bottom: 5px; }
.empty-sub { font-size: 12px; }
.pack-input { width: 70px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 10px; color: var(--text); font-size: 13px; font-family: var(--mono); text-align: center; }
.pack-control { display: flex; align-items: center; gap: 8px; }
.rule-item { background: var(--bg3); border-radius: var(--radius); padding: 12px; }
.rule-label { font-size: 10px; font-family: var(--mono); color: var(--text3); margin-bottom: 5px; letter-spacing: 0.5px; text-transform: uppercase; }
.rule-value { font-size: 14px; font-weight: 700; font-family: var(--mono); }
.cap-high { color: var(--green); }
.cap-med  { color: var(--yellow); }
.cap-low  { color: var(--red); }
.export-options { display: flex; gap: 8px; flex-wrap: wrap; }
.chart-placeholder { background: var(--bg3); border-radius: var(--radius); height: 130px; display: flex; align-items: flex-end; justify-content: center; gap: 8px; padding: 16px; overflow: hidden; }
.bar-chart-bar { flex: 1; border-radius: 4px 4px 0 0; max-width: 40px; cursor: pointer; transition: filter 0.15s; }
.bar-chart-bar:hover { filter: brightness(1.2); }
.pkg-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; font-family: var(--mono); color: var(--text3); background: var(--bg3); border: 1px solid var(--border); padding: 2px 7px; border-radius: 4px; }

/* TOAST */
.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 12px 16px; font-size: 13px; display: flex; align-items: center; gap: 10px; min-width: 260px; box-shadow: var(--shadow); animation: toastIn 0.25s cubic-bezier(0.34,1.56,0.64,1); transition: opacity 0.3s; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
.toast-success { border-color: var(--green); }
.toast-error   { border-color: var(--red); }
.toast-warn    { border-color: var(--yellow); }

/* BOX TYPE SELECTOR GRID */
.bt-selector-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
.bt-option { padding: 10px 8px; border-radius: var(--radius); border: 2px solid var(--border); cursor: pointer; text-align: center; transition: all 0.15s; background: var(--bg3); }

// ═══════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const fmtMoney = n => '$' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const getItem  = id => DB.inventory.find(i => i.id === id);
const getTmpl  = id => DB.templates.find(t => t.id === id);

function boxTypeTag(type) {
  const bt = BOX_TYPES[type]; if (!bt) return '';
  return `<span class="box-type-tag box-type-${type}">${bt.label}</span>`;
}
function pkgBadge(type) {
  const bt = BOX_TYPES[type]; if (!bt) return '';
  return `<span class="pkg-badge">📦 ${bt.pkgSize}</span>`;
}
function statusBadge(s) {
  const m = { draft:'gray', approved:'teal', active:'green', paused:'yellow' };
  return `<span class="badge badge-${m[s]||'gray'}">${s}</span>`;
}
function calcBoxValues(tmpl) {
  let retail=0, market=0;
  tmpl.components.forEach(c => { const it=getItem(c.inventoryId); if(it){ retail+=it.cost*c.qty; market+=it.market*c.qty; } });
  return { retail, market };
}
function calcBuildable(tmpl) {
  if (!tmpl.components.length) return { count:0, limiting:null };
  let min=Infinity, limitItem=null;
  for (const c of tmpl.components) {
    const it = getItem(c.inventoryId);
    if (!it) return { count:0, limiting:'Missing product' };
    const r = Math.floor(it.qty/c.qty);
    if (r < min) { min=r; limitItem=it.name; }
  }
  return { count: min===Infinity?0:min, limiting: limitItem };
}
function valueCompliance(tmpl) {
  const { retail, market } = calcBoxValues(tmpl);
  const issues=[];
  if (retail < tmpl.minRetailValue) issues.push({ msg:`Retail ${fmtMoney(retail)} below minimum ${fmtMoney(tmpl.minRetailValue)}` });
  if (market > tmpl.maxMarketValue) issues.push({ msg:`Market ${fmtMoney(market)} exceeds maximum ${fmtMoney(tmpl.maxMarketValue)}` });
  return issues;
}
function addHistory(type, msg) {
  DB.history.unshift({ id:Date.now(), type, ts:Date.now(), msg });
}
function dlCSV(content, filename) {
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(content);
  a.download=filename; a.click();
}

function toast(msg, type='success') {
  const icons = { success:'✅', error:'❌', warn:'⚠️', info:'ℹ️' };
  const el = document.createElement('div');
  el.className=`toast toast-${type}`;
  el.innerHTML=`<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  $('#toast-container').appendChild(el);
  setTimeout(()=>el.style.opacity='0', 2800);
  setTimeout(()=>el.remove(), 3100);
}

    dashboard:['Dashboard','Live overview — Pokémon Mystery Boxes'],
    inventory: ['Inventory Catalog','SKU-level product management'],
    templates: ['Box Templates','Mystery box configuration & compliance'],
    packing:   ['Pack Boxes','Assemble boxes & deduct inventory'],
    rules:     ['Rules & Config','Value thresholds & settings'],
    history:   ['History Log','Audit trail for all changes'],
    reports:   ['Reports','Margins, capacity & usage analytics'],
  };
  const [title,sub]=T[page]||['',''];
  $('#topbar-title').textContent=title;
  $('#topbar-sub').textContent=sub;
  const map={dashboard:renderDashboard,inventory:renderInventory,templates:renderTemplates,packing:renderPacking,rules:renderRules,history:renderHistory,reports:renderReports};
  if(map[page]) map[page]();
}

// ═══════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════
function renderDashboard() {
  const totalSKUs   = DB.inventory.length;
  const totalItems  = DB.inventory.reduce((s,i)=>s+i.qty,0);
  const totalRetail = DB.inventory.reduce((s,i)=>s+i.cost*i.qty,0);
  const totalMarket = DB.inventory.reduce((s,i)=>s+i.market*i.qty,0);
  const lowStock    = DB.inventory.filter(i=>i.qty<=DB.rules.lowStockThreshold).length;
  const activeBoxes = DB.templates.filter(t=>t.status==='active'||t.status==='approved').length;

  let warnings='';
  DB.templates.forEach(t=>{
    valueCompliance(t).forEach(iss=>{ warnings+=`<div class="alert alert-danger"><span class="alert-icon">❌</span><strong>${t.name}:</strong> ${iss.msg}</div>`; });
    const {count}=calcBuildable(t);
    if(count===0) warnings+=`<div class="alert alert-warn"><span class="alert-icon">⚠️</span><strong>${t.name}:</strong> Cannot be built — check inventory</div>`;
  });
  DB.inventory.filter(i=>i.qty<=DB.rules.criticalStockThreshold).forEach(i=>{
    warnings+=`<div class="alert alert-danger"><span class="alert-icon">🔴</span>Critical stock: <strong>${i.name}</strong> — only ${i.qty} remaining</div>`;
  });
  DB.inventory.filter(i=>i.qty>DB.rules.criticalStockThreshold&&i.qty<=DB.rules.lowStockThreshold).forEach(i=>{
    warnings+=`<div class="alert alert-warn"><span class="alert-icon">⚠️</span>Low stock: <strong>${i.name}</strong> — ${i.qty} remaining</div>`;
  });

  const MAX_REF=50;
  let capacityHTML='';
  DB.templates.forEach(tmpl=>{
    const {count,limiting}=calcBuildable(tmpl);
    const {retail,market}=calcBoxValues(tmpl);
    const issues=valueCompliance(tmpl);
    const pct=Math.min(100,(count/MAX_REF)*100);
    const meterCls=count===0?'meter-empty':`meter-${tmpl.boxType}`;
    const capCls=count>=15?'cap-high':count>=5?'cap-med':'cap-low';
    const configNote=tmpl.boxType==='premium'&&tmpl.premiumConfig?` · Config ${tmpl.premiumConfig}`:'';
    capacityHTML+=`
      <div class="capacity-card cap-${tmpl.boxType}">
        <div class="capacity-header">
          <div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
              ${boxTypeTag(tmpl.boxType)} ${pkgBadge(tmpl.boxType)} ${statusBadge(tmpl.status)}
              ${issues.length?`<span class="badge badge-red">⚠ ${issues.length} issue${issues.length>1?'s':''}</span>`:'<span class="badge badge-green">✓ OK</span>'}
            </div>
            <div class="capacity-name">${tmpl.name}</div>
            <div class="capacity-meta">${BOX_TYPES[tmpl.boxType]?.label||''} box${configNote} · ${tmpl.components.length} components</div>
          </div>
          <div>
            <div class="capacity-count ${capCls}">${count}</div>
            <div class="capacity-count-label">Buildable</div>
          </div>
        </div>
        <div class="meter-track"><div class="meter-fill ${meterCls}" style="width:${pct}%"></div></div>
        <div class="capacity-footer">
          <span>Retail: <strong>${fmtMoney(retail)}</strong> · Market: <strong>${fmtMoney(market)}</strong> · Sale: <strong>${fmtMoney(tmpl.salePrice)}</strong></span>
          ${limiting&&count<MAX_REF?`<span class="limiting-item">⚡ ${limiting.length>30?limiting.slice(0,28)+'…':limiting}</span>`:''}
        </div>
      </div>`;
  });

  $('#topbar-actions').innerHTML=`<button class="btn btn-primary" onclick="navigate('templates')">+ New Box Template</button>`;
  $('#content').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card c-accent"><div class="stat-icon">🗃️</div><div class="stat-label">Pokémon SKUs</div><div class="stat-value">${totalSKUs}</div><div class="stat-sub">${totalItems.toLocaleString()} total items</div></div>
      <div class="stat-card c-teal"><div class="stat-icon">💰</div><div class="stat-label">Inventory Cost</div><div class="stat-value">${fmtMoney(totalRetail)}</div><div class="stat-sub">Purchase basis</div></div>
      <div class="stat-card c-purple"><div class="stat-icon">📈</div><div class="stat-label">Market Value</div><div class="stat-value">${fmtMoney(totalMarket)}</div><div class="stat-sub">TCGplayer est.</div></div>
      <div class="stat-card c-green"><div class="stat-icon">📦</div><div class="stat-label">Box Templates</div><div class="stat-value">${DB.templates.length}</div><div class="stat-sub">${activeBoxes} active/approved</div></div>
      <div class="stat-card ${lowStock?'c-red':'c-green'}"><div class="stat-icon">⚡</div><div class="stat-label">Low Stock SKUs</div><div class="stat-value">${lowStock}</div><div class="stat-sub">≤ ${DB.rules.lowStockThreshold} units</div></div>
    </div>
    ${warnings
      ?`<div class="card" style="margin-bottom:22px;"><div class="card-header"><div class="card-title">⚠ Alerts</div></div><div class="card-body">${warnings}</div></div>`
      :`<div class="alert alert-success" style="margin-bottom:22px;"><span class="alert-icon">✅</span>All boxes are compliant. No stock alerts.</div>`}
    <div class="section-header">
      <div><div class="section-title">Build Capacity</div><div class="section-sub">How many boxes can be built right now</div></div>
      <button class="btn btn-secondary btn-sm" onclick="navigate('packing')">Pack Boxes →</button>
    </div>
    ${capacityHTML}`;
}

// INVENTORY
// ═══════════════════════════════════════
function renderInventory(filter='', catFilter='', condFilter='') {
  const cats  = [...new Set(DB.inventory.map(i=>i.category))];
  const conds = [...new Set(DB.inventory.map(i=>i.condition))];
  const items = DB.inventory.filter(i=>{
    const q=filter.toLowerCase();
    return (!q||i.name.toLowerCase().includes(q)||i.sku.toLowerCase().includes(q)||i.category.toLowerCase().includes(q))
        &&(!catFilter||i.category===catFilter)
        &&(!condFilter||i.condition===condFilter);
  });

  const rows=items.map(item=>{
    const dot=item.qty<=DB.rules.criticalStockThreshold?'red':item.qty<=DB.rules.lowStockThreshold?'yellow':'green';
    const margin=item.market-item.cost;
    const pct=((margin/item.cost)*100).toFixed(0);
    return `<tr>
      <td class="td-mono">${item.sku}</td>
      <td style="font-weight:600;max-width:200px;">${item.name}</td>
      <td><span class="badge badge-gray">${item.category}</span></td>
      <td><span class="badge ${item.condition==='NM'?'badge-green':item.condition==='LP'||item.condition==='MP'?'badge-yellow':'badge-red'}">${item.condition}</span></td>
      <td><div class="stock-indicator"><div class="stock-dot stock-dot-${dot}"></div><span class="td-mono">${item.qty}</span></div></td>
      <td class="td-mono">${fmtMoney(item.cost)}</td>
      <td class="td-mono" style="color:var(--purple);">${fmtMoney(item.market)}</td>
      <td class="td-mono" style="color:${margin>=0?'var(--green)':'var(--red)'};">+${fmtMoney(margin)} (${pct}%)</td>
      <td>
        <div style="display:flex;gap:4px;">
          <button class="btn-icon" onclick="openAddProduct('${item.id}')" title="Edit">✏️</button>
          <button class="btn-icon" onclick="adjustStock('${item.id}')" title="Adjust Stock">📥</button>
          <button class="btn-icon" onclick="deleteItem('${item.id}')" title="Delete" style="color:var(--red);">🗑</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  $('#topbar-actions').innerHTML=`
    <button class="btn btn-secondary btn-sm" onclick="exportInventoryCSV()">↓ CSV</button>
    <button class="btn btn-primary" onclick="openAddProduct(null)">+ Add Product</button>`;
  $('#content').innerHTML=`
    <div class="filter-row">
      <div class="search-bar" style="max-width:280px;">
        <span>🔍</span>
        <input type="text" placeholder="Search SKU, name, category…" id="inv-search" value="${filter}"
          oninput="renderInventory(this.value,document.getElementById('inv-cat').value,document.getElementById('inv-cond').value)">
      </div>
      <select class="filter-select" id="inv-cat" onchange="renderInventory(document.getElementById('inv-search').value,this.value,document.getElementById('inv-cond').value)">
        <option value="">All Categories</option>
        ${cats.map(c=>`<option value="${c}" ${catFilter===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <select class="filter-select" id="inv-cond" onchange="renderInventory(document.getElementById('inv-search').value,document.getElementById('inv-cat').value,this.value)">
        <option value="">All Conditions</option>
        ${conds.map(c=>`<option value="${c}" ${condFilter===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <span style="margin-left:auto;font-size:11px;color:var(--text3);font-family:var(--mono);">${items.length}/${DB.inventory.length}</span>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Cond</th><th>Qty</th><th>Cost</th><th>Market</th><th>Margin</th><th></th></tr></thead>
          <tbody>${rows||'<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">🗃️</div><div class="empty-title">No products found</div></div></td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}

function openAddProduct(id) {
  const item=id?getItem(id):null;
  const cats=[...new Set([...DB.inventory.map(i=>i.category),'Tins','5-Pack Tins','Mini Tins','Blisters','ETBs','Collector Chests','EX Boxes','Singles','Singles Packs','Vintage'])];
  openModal(item?'Edit Product':'Add Pokémon Product',`
    <div class="form-row form-row-2">
      <div class="form-group"><label class="form-label">SKU *</label><input class="form-control" id="f-sku" value="${item?.sku||''}" placeholder="PKM-TIN-001"></div>
      <div class="form-group"><label class="form-label">Product Name *</label><input class="form-control" id="f-name" value="${item?.name||''}" placeholder="Full product name"></div>
    </div>
    <div class="form-row form-row-3">
      <div class="form-group"><label class="form-label">Category</label>
        <select class="form-control" id="f-cat">${[...new Set(cats)].map(c=>`<option ${item?.category===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label class="form-label">Condition</label>
        <select class="form-control" id="f-cond">${['NM','LP','MP','HP','DMG'].map(c=>`<option ${item?.condition===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label class="form-label">Qty on Hand</label><input class="form-control" id="f-qty" type="number" min="0" value="${item?.qty||0}"></div>
    </div>
    <div class="form-row form-row-2">
      <div class="form-group"><label class="form-label">Purchase Cost (Retail Value) *</label><input class="form-control" id="f-cost" type="number" min="0" step="0.01" value="${item?.cost||''}"><div class="form-hint">What you paid for this item</div></div>
      <div class="form-group"><label class="form-label">TCGplayer Market Value *</label><input class="form-control" id="f-market" type="number" min="0" step="0.01" value="${item?.market||''}"><div class="form-hint">Current sell price</div></div>
    </div>
  `,`
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveProduct('${id||''}')">Save Product</button>
  `);
}

function saveProduct(id) {
  const sku=document.getElementById('f-sku')?.value.trim();
  const name=document.getElementById('f-name')?.value.trim();
  const cost=parseFloat(document.getElementById('f-cost')?.value);
  const market=parseFloat(document.getElementById('f-market')?.value);
  const qty=parseInt(document.getElementById('f-qty')?.value)||0;
  if(!sku||!name||isNaN(cost)||isNaN(market)){toast('Fill all required fields','error');return;}
  if(id){
    Object.assign(getItem(id),{sku,name,category:document.getElementById('f-cat').value,condition:document.getElementById('f-cond').value,qty,cost,market});
    addHistory('add',`Updated product: ${name}`);
    toast(`Updated ${name}`);
  } else {
    DB.inventory.push({id:'INV'+Date.now().toString().slice(-6),sku,name,category:document.getElementById('f-cat').value,condition:document.getElementById('f-cond').value,qty,cost,market});
    addHistory('add',`Added product: ${name} (${sku})`);
    toast(`Added ${name}`,'success');
  }
  closeModal(); renderInventory();
}

function adjustStock(id) {
  const item=getItem(id);
  openModal(`Adjust Stock: ${item.name}`,`
    <div class="alert alert-info"><span class="alert-icon">ℹ️</span>Current quantity: <strong>${item.qty}</strong></div>
    <div class="form-group"><label class="form-label">Adjustment (+/−)</label><input class="form-control" id="adj-qty" type="number" value="0" placeholder="+50 or -10"></div>
    <div class="form-group"><label class="form-label">Reason</label><input class="form-control" id="adj-reason" placeholder="e.g. Received shipment, Damaged"></div>
  `,`
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="applyAdj('${id}')">Apply</button>
  `);
}

function applyAdj(id) {
  const item=getItem(id);
  const adj=parseInt(document.getElementById('adj-qty').value);
  const rsn=document.getElementById('adj-reason').value||'Manual';
  if(isNaN(adj)){toast('Invalid number','error');return;}
  item.qty=Math.max(0,item.qty+adj);
  addHistory(adj>=0?'add':'remove',`Stock ${adj>=0?'+':''}${adj} for ${item.name} (${rsn}). New qty: ${item.qty}`);
  toast(`Stock updated to ${item.qty}`);
  closeModal(); renderInventory();
}

function deleteItem(id) {
  const item=getItem(id);
  openModal('Confirm Delete',`
    <div class="alert alert-danger"><span class="alert-icon">❌</span>Delete <strong>${item.name}</strong>? This cannot be undone.</div>
  `,`
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-danger" onclick="confirmDeleteItem('${id}')">Delete</button>
  `);
}

function confirmDeleteItem(id) {
  const item=getItem(id);
  const inUse=DB.templates.some(t=>t.components.some(c=>c.inventoryId===id));
  if(inUse){toast('Cannot delete — used in a box template','error');closeModal();return;}
  DB.inventory=DB.inventory.filter(i=>i.id!==id);
  addHistory('remove',`Deleted product: ${item.name}`);
  toast(`Deleted ${item.name}`,'warn');
  closeModal(); renderInventory();
}

function exportInventoryCSV() {
  let csv='SKU,Name,Category,Condition,Qty,Cost,Market\n';
  DB.inventory.forEach(i=>{csv+=`${i.sku},"${i.name}",${i.category},${i.condition},${i.qty},${i.cost.toFixed(2)},${i.market.toFixed(2)}\n`;});
  dlCSV(csv,'pokemon-inventory.csv'); toast('Inventory exported','success');
}

function renderTemplates() {
  const cards=DB.templates.map(tmpl=>{
    const {retail,market}=calcBoxValues(tmpl);
    const {count,limiting}=calcBuildable(tmpl);
    const issues=valueCompliance(tmpl);
    const pct=Math.min(100,(count/50)*100);
    const meterCls=count===0?'meter-empty':`meter-${tmpl.boxType}`;
    const capCls=count>=15?'cap-high':count>=5?'cap-med':'cap-low';
    const margin=tmpl.salePrice-retail;
    const configNote=tmpl.boxType==='premium'&&tmpl.premiumConfig?` · Config ${tmpl.premiumConfig}`:'';
    const prev=tmpl.components.slice(0,3).map(c=>{const it=getItem(c.inventoryId);return it?`${c.qty}× ${it.name.slice(0,22)}`:''}).filter(Boolean).join(', ');
    return `
      <div class="card" style="margin-bottom:14px;">
        <div class="card-header">
          <div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
              ${boxTypeTag(tmpl.boxType)} ${pkgBadge(tmpl.boxType)} ${statusBadge(tmpl.status)}
              ${issues.length?`<span class="badge badge-red">⚠ ${issues.length} issue${issues.length>1?'s':''}</span>`:'<span class="badge badge-green">✓ Compliant</span>'}
            </div>
            <div style="font-size:16px;font-weight:800;">${tmpl.name}</div>
            <div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:3px;">${BOX_TYPES[tmpl.boxType]?.label||''} box${configNote}</div>
          </div>
          <div style="display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;">
            <button class="btn btn-secondary btn-sm" onclick="openBoxEditor('${tmpl.id}')">✏️ Edit</button>
            <button class="btn btn-secondary btn-sm" onclick="viewBoxDetail('${tmpl.id}')">👁 View</button>
            ${tmpl.status==='draft'?`<button class="btn btn-success btn-sm" onclick="approveBox('${tmpl.id}')">✓ Approve</button>`:''}
            ${tmpl.status==='approved'?`<button class="btn btn-primary btn-sm" onclick="activateBox('${tmpl.id}')">🚀 Activate</button>`:''}
          </div>
        </div>
        <div class="card-body">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:14px;">
            <div><div class="stat-label">Retail Value</div><div style="font-size:15px;font-weight:800;font-family:var(--mono);color:var(--teal);">${fmtMoney(retail)}</div></div>
            <div><div class="stat-label">Market Value</div><div style="font-size:15px;font-weight:800;font-family:var(--mono);color:var(--purple);">${fmtMoney(market)}</div></div>
            <div><div class="stat-label">Sale Price</div><div style="font-size:15px;font-weight:800;font-family:var(--mono);">${fmtMoney(tmpl.salePrice)}</div></div>
            <div><div class="stat-label">Margin</div><div style="font-size:15px;font-weight:800;font-family:var(--mono);color:${margin>=0?'var(--green)':'var(--red)'};">${fmtMoney(margin)}</div></div>
          </div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:8px;font-family:var(--mono);">${prev}${tmpl.components.length>3?` +${tmpl.components.length-3} more`:''}</div>
          <div class="meter-track" style="height:10px;"><div class="meter-fill ${meterCls}" style="width:${pct}%"></div></div>
          <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text3);font-family:var(--mono);">
            <span>Buildable: <strong class="${capCls}" style="font-size:14px;">${count}</strong></span>
            ${limiting&&count<50?`<span class="limiting-item">⚡ ${limiting.length>30?limiting.slice(0,28)+'…':limiting}</span>`:''}
          </div>
          ${issues.map(iss=>`<div class="alert alert-danger" style="margin-top:8px;"><span class="alert-icon">❌</span>${iss.msg}</div>`).join('')}
        </div>
      </div>`;
  }).join('');

  $('#topbar-actions').innerHTML=`<button class="btn btn-primary" onclick="openBoxEditor(null)">+ New Template</button>`;
  $('#content').innerHTML=`
    <div class="section-header">
      <div><div class="section-title">Box Templates</div><div class="section-sub">${DB.templates.length} configured</div></div>
    </div>
    ${cards||'<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-title">No templates yet</div></div>'}`;
}

function approveBox(id) {
  const tmpl=getTmpl(id);
  const issues=valueCompliance(tmpl);
  if(issues.length){toast('Fix value violations before approving','error');return;}
  tmpl.status='approved';
  addHistory('approve',`Approved "${tmpl.name}"`);
  toast(`"${tmpl.name}" approved!`,'success');
  renderTemplates();
}

function activateBox(id) {
  const tmpl=getTmpl(id);
  tmpl.status='active';
  addHistory('approve',`Activated "${tmpl.name}"`);
  toast(`"${tmpl.name}" is now active!`,'success');
  renderTemplates();
}

function viewBoxDetail(id) {
  const tmpl=getTmpl(id);
  const {retail,market}=calcBoxValues(tmpl);
  const {count,limiting}=calcBuildable(tmpl);
  const issues=valueCompliance(tmpl);
  const bt=BOX_TYPES[tmpl.boxType];

  let slotHTML='';
  if(tmpl.boxType==='premium') {
    Object.entries(bt.configs).forEach(([k,cfg])=>{
      const active=tmpl.premiumConfig===k;
      slotHTML+=`<div style="margin-bottom:10px;padding:10px;border-radius:var(--radius);border:1px solid ${active?'var(--premium-color)':'var(--border)'};background:${active?'var(--blue-dim)':'var(--bg3)'};">
        <div style="font-size:11px;font-weight:700;color:${active?'var(--blue)':'var(--text3)'};margin-bottom:5px;font-family:var(--mono);">${cfg.label}${active?' ← ACTIVE':''}</div>
        <div style="font-size:12px;color:var(--text2);">${cfg.desc}</div>
      </div>`;
    });
  } else {
    const slots=bt?.slots||[];
    slotHTML=`<div style="display:flex;flex-wrap:wrap;gap:5px;">${slots.map(s=>`
      <span style="display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);font-size:11px;">
        <span style="font-family:var(--mono);font-weight:700;color:var(--accent);">${s.qty}×</span>
        <span style="font-weight:600;">${s.label}</span>
        <span style="color:var(--text3);font-size:10px;">${s.note}</span>
      </span>`).join('')}</div>`;
  }

  const compRows=tmpl.components.map(c=>{
    const it=getItem(c.inventoryId); if(!it) return '';
    return `<tr>
      <td class="td-mono">${it.sku}</td><td>${it.name}</td>
      <td class="td-mono">${c.qty}</td>
      <td class="td-mono">${fmtMoney(it.cost*c.qty)}</td>
      <td class="td-mono" style="color:var(--purple);">${fmtMoney(it.market*c.qty)}</td>
      <td><div class="stock-indicator"><div class="stock-dot stock-dot-${it.qty<=5?'red':it.qty<=20?'yellow':'green'}"></div>${it.qty}</div></td>
    </tr>`;
  }).join('');

  openModal(`Detail: ${tmpl.name}`,`
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">${boxTypeTag(tmpl.boxType)} ${pkgBadge(tmpl.boxType)} ${statusBadge(tmpl.status)}</div>
    ${issues.map(iss=>`<div class="alert alert-danger"><span class="alert-icon">❌</span>${iss.msg}</div>`).join('')}
    ${!issues.length?'<div class="alert alert-success"><span class="alert-icon">✅</span>All value rules satisfied.</div>':''}
    <div style="font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text3);">Required box content:</div>
    <div style="margin-bottom:14px;">${slotHTML}</div>
    <div class="sep"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
      <div class="rule-item"><div class="rule-label">Retail Value</div><div class="rule-value" style="color:var(--teal);">${fmtMoney(retail)}</div></div>
      <div class="rule-item"><div class="rule-label">Market Value</div><div class="rule-value" style="color:var(--purple);">${fmtMoney(market)}</div></div>
      <div class="rule-item"><div class="rule-label">Sale Price</div><div class="rule-value">${fmtMoney(tmpl.salePrice)}</div></div>
      <div class="rule-item"><div class="rule-label">Buildable Now</div><div class="rule-value ${count>=15?'cap-high':count>=5?'cap-med':'cap-low'}">${count} boxes</div></div>
      <div class="rule-item"><div class="rule-label">Min Retail Rule</div><div class="rule-value">${fmtMoney(tmpl.minRetailValue)}</div></div>
      <div class="rule-item"><div class="rule-label">Max Market Rule</div><div class="rule-value">${fmtMoney(tmpl.maxMarketValue)}</div></div>
    </div>
    <div style="font-size:13px;font-weight:700;margin-bottom:10px;">Assigned Components</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>SKU</th><th>Product</th><th>Qty/Box</th><th>Retail</th><th>Market</th><th>Stock</th></tr></thead>
        <tbody>${compRows}</tbody>
        <tfoot><tr style="background:var(--bg3);">
          <td colspan="3" style="font-weight:700;padding:8px 12px;">Totals</td>
          <td class="td-mono" style="color:var(--teal);font-weight:700;">${fmtMoney(retail)}</td>
          <td class="td-mono" style="color:var(--purple);font-weight:700;">${fmtMoney(market)}</td>
          <td></td>
        </tr></tfoot>
      </table>
    </div>
    ${limiting?`<div class="alert alert-warn" style="margin-top:12px;"><span class="alert-icon">⚡</span>Limiting component: <strong>${limiting}</strong></div>`:''}
  `,`
    <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    <button class="btn btn-secondary" onclick="exportPackingList('${id}')">↓ Packing List</button>
    ${tmpl.status==='draft'?`<button class="btn btn-success" onclick="closeModal();approveBox('${id}')">✓ Approve</button>`:''}
  `);
}

function exportPackingList(id) {
  const tmpl=getTmpl(id);
  const {retail,market}=calcBoxValues(tmpl);
  let csv=`Box Template: ${tmpl.name}\nType: ${tmpl.boxType}\nPackage: ${BOX_TYPES[tmpl.boxType]?.pkgSize||''}\n\nSKU,Product,Qty/Box,Retail,Market\n`;
  tmpl.components.forEach(c=>{const it=getItem(c.inventoryId);if(it) csv+=`${it.sku},"${it.name}",${c.qty},${(it.cost*c.qty).toFixed(2)},${(it.market*c.qty).toFixed(2)}\n`;});
  csv+=`\nTotal Retail,${retail.toFixed(2)}\nTotal Market,${market.toFixed(2)}\nSale Price,${tmpl.salePrice.toFixed(2)}\n`;
  dlCSV(csv,`packing-${tmpl.id}.csv`); toast('Packing list exported!','success');
}

      <div class="alert alert-info"><span class="alert-icon">ℹ️</span>Assign specific inventory items to fill the required slots for this box type.</div>
      <div style="display:flex;gap:8px;margin-bottom:12px;align-items:flex-end;">
        <div class="form-group" style="flex:1;margin-bottom:0;">
          <label class="form-label">Add Inventory Item</label>
          <select class="form-control" id="comp-select">
            ${DB.inventory.map(i=>`<option value="${i.id}">[${i.category}] ${i.name} (Stock: ${i.qty})</option>`).join('')}
          </select>
        </div>
        <button class="btn btn-secondary" onclick="addComp()">+ Add</button>
      </div>
      <div class="component-list scroll-panel" id="comp-list" style="min-height:60px;"></div>
      <div style="margin-top:10px;padding:10px;background:var(--bg3);border-radius:var(--radius);">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-family:var(--mono);">
          <span>Retail: <strong id="calc-retail">$0.00</strong></span>
          <span>Market: <strong id="calc-market">$0.00</strong></span>
          <span>Buildable: <strong id="calc-buildable">0</strong> boxes</span>
        </div>
      </div>
    </div>

    <div id="ed-pricing" style="display:none;">
      <div class="form-row form-row-2">
        <div class="form-group"><label class="form-label">Sale Price</label><input class="form-control" id="be-sale" type="number" step="0.01" value="${tmpl?.salePrice||''}"></div>
        <div></div>
      </div>
      <div class="sep"></div>
      <div style="font-size:12px;font-weight:700;margin-bottom:10px;">Value Rules</div>
      <div class="form-row form-row-2">
        <div class="form-group"><label class="form-label">Min Retail Value</label><input class="form-control" id="be-minret" type="number" step="0.01" value="${tmpl?.minRetailValue||DB.rules.minRetailValueDefault}"><div class="form-hint">Components must cost at least this</div></div>
        <div class="form-group"><label class="form-label">Max Market Value</label><input class="form-control" id="be-maxmkt" type="number" step="0.01" value="${tmpl?.maxMarketValue||DB.rules.maxMarketValueDefault}"><div class="form-hint">Market value must not exceed this</div></div>
      </div>
      <div id="compliance-preview"></div>
    </div>
  `,`
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveBoxTemplate('${id||''}')">💾 Save Template</button>
  `);
  setTimeout(()=>{renderCompList();updateBoxCalc();renderSlotPreview();},40);
}

window.selectBoxType=function(bt){
  window._editBoxType=bt;
  ['starter','deluxe','premium','collector'].forEach(b=>{
    const el=document.getElementById(`bt-opt-${b}`); if(!el) return;
    el.className='bt-option'+(b===bt?' sel-'+b:'');
  });
  const pr=document.getElementById('premium-config-row');
  if(pr) pr.style.display=bt==='premium'?'':'none';
  renderSlotPreview();
};

window.selectPremiumConfig=function(cfg){
  window._editPremiumConfig=cfg;
  ['A','B'].forEach(c=>{
    const el=document.getElementById(`cfg-${c}`);
    if(el) el.classList.toggle('selected',c===cfg);
  });
  renderSlotPreview();
};

function renderSlotPreview(){
  const el=document.getElementById('slots-preview'); if(!el) return;
  const bt=BOX_TYPES[window._editBoxType]; if(!bt) return;
  let slots=bt.slots;
  if(window._editBoxType==='premium') slots=bt.configs[window._editPremiumConfig]?.slots||[];
  el.innerHTML=`
    <div style="font-size:10px;font-weight:700;color:var(--text3);font-family:var(--mono);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;">Required Slots</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;">
      ${slots.map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);font-size:11px;">
        <span style="font-family:var(--mono);font-weight:700;color:var(--accent);">${s.qty}×</span>
        <span style="font-weight:600;">${s.label}</span>
      </span>`).join('')}
    </div>`;
}

window.edTab=function(tab){
  ['details','components','pricing'].forEach(t=>{
    const el=document.getElementById(`ed-${t}`); if(el) el.style.display=t===tab?'':'none';
  });
  document.querySelectorAll('#editor-tabs .tab').forEach((btn,i)=>{
    btn.classList.toggle('active',['details','components','pricing'][i]===tab);
  });
  if(tab==='components') renderCompList();
  if(tab==='pricing') updateCompliancePreview();
};

function renderCompList(){
  const el=document.getElementById('comp-list'); if(!el) return;
  if(!window._editComps.length){el.innerHTML='<div style="text-align:center;color:var(--text3);font-size:12px;padding:16px;">No components added yet</div>';return;}
  el.innerHTML=window._editComps.map((c,idx)=>{
    const it=getItem(c.inventoryId); if(!it) return '';
    return `<div class="component-row">
      <div class="comp-name">${it.name}<br><span style="font-size:10px;color:var(--text3);font-family:var(--mono);">${it.sku} · Stock: ${it.qty}</span></div>
      <input class="comp-qty" type="number" min="1" value="${c.qty}" onchange="updateCompQty(${idx},this.value)">
      <div class="comp-val">${fmtMoney(it.cost*c.qty)} / ${fmtMoney(it.market*c.qty)}</div>
      <button class="comp-remove" onclick="removeComp(${idx})">✕</button>
    </div>`;
  }).join('');
  updateBoxCalc();
}

window.addComp=function(){
  const sel=document.getElementById('comp-select');
  const invId=sel?.value;
  if(window._editComps.find(c=>c.inventoryId===invId)){toast('Already added','warn');return;}
  window._editComps.push({inventoryId:invId,qty:1});
  renderCompList();
};
window.removeComp=function(idx){window._editComps.splice(idx,1);renderCompList();};
window.updateCompQty=function(idx,v){window._editComps[idx].qty=Math.max(1,parseInt(v)||1);updateBoxCalc();};

function updateBoxCalc(){
  let retail=0,market=0,buildable=Infinity;
  window._editComps.forEach(c=>{const it=getItem(c.inventoryId);if(!it)return;retail+=it.cost*c.qty;market+=it.market*c.qty;const r=Math.floor(it.qty/c.qty);if(r<buildable)buildable=r;});
  if(buildable===Infinity)buildable=0;
  const cr=document.getElementById('calc-retail');if(cr)cr.textContent=fmtMoney(retail);
  const cm=document.getElementById('calc-market');if(cm)cm.textContent=fmtMoney(market);
  const cb=document.getElementById('calc-buildable');if(cb)cb.textContent=buildable;
}

function updateCompliancePreview(){
  const minR=parseFloat(document.getElementById('be-minret')?.value)||0;
  const maxM=parseFloat(document.getElementById('be-maxmkt')?.value)||9999;
  let retail=0,market=0;
  window._editComps.forEach(c=>{const it=getItem(c.inventoryId);if(it){retail+=it.cost*c.qty;market+=it.market*c.qty;}});
  const el=document.getElementById('compliance-preview');if(!el)return;
  el.innerHTML=`
    ${retail<minR?`<div class="alert alert-danger"><span class="alert-icon">❌</span>Retail ${fmtMoney(retail)} below minimum ${fmtMoney(minR)}</div>`:`<div class="alert alert-success"><span class="alert-icon">✅</span>Retail ${fmtMoney(retail)} ≥ min ${fmtMoney(minR)}</div>`}
    ${market>maxM?`<div class="alert alert-danger"><span class="alert-icon">❌</span>Market ${fmtMoney(market)} exceeds max ${fmtMoney(maxM)}</div>`:`<div class="alert alert-success"><span class="alert-icon">✅</span>Market ${fmtMoney(market)} ≤ max ${fmtMoney(maxM)}</div>`}
  `;
}

function saveBoxTemplate(id){
  const name=document.getElementById('be-name')?.value.trim();
  if(!name){toast('Box name required','error');return;}
  const data={
    name,
    boxType:window._editBoxType,
    premiumConfig:window._editBoxType==='premium'?window._editPremiumConfig:undefined,
    components:window._editComps,
    salePrice:parseFloat(document.getElementById('be-sale')?.value)||0,
    minRetailValue:parseFloat(document.getElementById('be-minret')?.value)||DB.rules.minRetailValueDefault,
    maxMarketValue:parseFloat(document.getElementById('be-maxmkt')?.value)||DB.rules.maxMarketValueDefault,
  };
  if(id){
    Object.assign(getTmpl(id),data);
    addHistory('approve',`Updated template: ${name}`);
    toast('Template updated!');
  } else {
    DB.templates.push({id:'BOX'+Date.now().toString().slice(-6),status:'draft',...data});
    addHistory('add',`Created template: ${name}`);
    toast(`"${name}" created!`,'success');
  }
  closeModal();renderTemplates();
}

// ═══════════════════════════════════════
// PACKING
// ═══════════════════════════════════════
function renderPacking(){
  const active=DB.templates.filter(t=>t.status==='active'||t.status==='approved');
  const rows=active.map(tmpl=>{
    const {count}=calcBuildable(tmpl);
    const {retail,market}=calcBoxValues(tmpl);
    const configNote=tmpl.boxType==='premium'&&tmpl.premiumConfig?` (Cfg ${tmpl.premiumConfig})`:'';
    return `<tr>
      <td><div style="font-weight:700;">${tmpl.name}</div><div style="font-size:10px;color:var(--text3);font-family:var(--mono);">${configNote}</div></td>
      <td>${boxTypeTag(tmpl.boxType)} ${pkgBadge(tmpl.boxType)}</td>
      <td class="td-mono">${fmtMoney(retail)}</td>
      <td class="td-mono" style="color:var(--purple);">${fmtMoney(market)}</td>
      <td><span class="${count>=15?'cap-high':count>=5?'cap-med':'cap-low'}" style="font-family:var(--mono);font-weight:800;font-size:15px;">${count}</span></td>
      <td>
        <div class="pack-control">
          <input class="pack-input" type="number" id="pack-qty-${tmpl.id}" min="1" max="${count}" value="1" ${count===0?'disabled':''}>
          <button class="btn btn-primary btn-sm" onclick="packBoxes('${tmpl.id}')" ${count===0?'disabled':''}>Pack</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  $('#topbar-actions').innerHTML='';
  $('#content').innerHTML=`
    <div class="alert alert-info"><span class="alert-icon">📦</span>Packing deducts all component inventory automatically. Only active/approved templates appear here.</div>
    <div class="card" style="margin-bottom:20px;">
      <div class="card-header"><div class="card-title">Pack Boxes</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Template</th><th>Type</th><th>Retail</th><th>Market</th><th>Buildable</th><th>Pack</th></tr></thead>
          <tbody>${rows||'<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📬</div><div class="empty-title">No active templates</div></div></td></tr>'}</tbody>
        </table>
      </div>
    </div>
    <div style="font-size:14px;font-weight:800;margin-bottom:12px;">Recent Packing</div>
    <div class="log-list">
      ${DB.history.filter(h=>h.type==='pack').slice(0,5).map(h=>`
        <div class="log-item log-pack">
          <div style="font-size:16px;">📦</div>
          <div style="flex:1;"><div class="log-msg">${h.msg}</div><div class="log-time">${new Date(h.ts).toLocaleString()}</div></div>
        </div>`).join('')||'<div style="color:var(--text3);font-size:12px;font-family:var(--mono);">No packing history yet.</div>'}
    </div>`;
}

function packBoxes(id){
  const tmpl=getTmpl(id);
  const qty=parseInt(document.getElementById(`pack-qty-${id}`)?.value)||1;
  const {count}=calcBuildable(tmpl);
  if(qty>count){toast(`Only ${count} buildable right now`,'error');return;}
  tmpl.components.forEach(c=>{const it=getItem(c.inventoryId);if(it)it.qty=Math.max(0,it.qty-(c.qty*qty));});
  addHistory('pack',`Packed ${qty}× "${tmpl.name}" — inventory deducted`);
  toast(`Packed ${qty}× "${tmpl.name}"!`,'success');
  renderPacking();
}

// ═══════════════════════════════════════
// RULES
// ═══════════════════════════════════════
function renderRules(){
  $('#topbar-actions').innerHTML='';
  $('#content').innerHTML=`
    <div class="grid-2" style="gap:20px;align-items:start;margin-bottom:20px;">
      <div class="card">
        <div class="card-header"><div class="card-title">⚙️ Global Value Rules</div></div>
        <div class="card-body">
          <div class="form-group"><label class="form-label">Default Min Retail Value</label><input class="form-control" id="r-minret" type="number" step="0.01" value="${DB.rules.minRetailValueDefault}"><div class="form-hint">Templates without custom rules use this</div></div>
          <div class="form-group"><label class="form-label">Default Max Market Value</label><input class="form-control" id="r-maxmkt" type="number" step="0.01" value="${DB.rules.maxMarketValueDefault}"><div class="form-hint">Boxes over this cannot be approved</div></div>
          <button class="btn btn-primary" onclick="saveRules()">Save Rules</button>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">📦 Stock Thresholds</div></div>
        <div class="card-body">
          <div class="form-group"><label class="form-label">Low Stock Warning Level</label><input class="form-control" id="r-lowstock" type="number" min="1" value="${DB.rules.lowStockThreshold}"><div class="form-hint">Yellow alert below this qty</div></div>
          <div class="form-group"><label class="form-label">Critical Stock Level</label><input class="form-control" id="r-critical" type="number" min="0" value="${DB.rules.criticalStockThreshold}"><div class="form-hint">Red alert at or below this qty</div></div>
          <button class="btn btn-primary" onclick="saveRules()">Save Rules</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-bottom:20px;">
      <div class="card-header"><div class="card-title">📤 Exports</div></div>
      <div class="card-body">
        <div class="export-options">
          <button class="btn btn-secondary" onclick="exportInventoryCSV()">↓ Inventory CSV</button>
          <button class="btn btn-secondary" onclick="exportAllTemplates()">↓ Box Templates CSV</button>
          <button class="btn btn-secondary" onclick="exportHistoryCSV()">↓ History Log CSV</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">🎮 Pokémon Box Type Reference</div></div>
      <div class="card-body">
        ${Object.entries(BOX_TYPES).map(([key,bt])=>{
          const slots=bt.slots||[];
          const configs=bt.configs||null;
          return `<div style="margin-bottom:16px;padding:14px;border-radius:var(--radius);border:1px solid var(--border);border-left:3px solid var(--${key}-color);">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">${boxTypeTag(key)} ${pkgBadge(key)}</div>
            ${slots.length?`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px;">${slots.map(s=>`<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);font-size:11px;"><span style="font-family:var(--mono);font-weight:700;color:var(--accent);">${s.qty}×</span><span style="font-weight:600;">${s.label}</span><span style="color:var(--text3);font-size:10px;">${s.note}</span></span>`).join('')}</div>`:''}
            ${configs?Object.entries(configs).map(([k,c])=>`<div style="margin-top:8px;"><span style="font-size:10px;font-family:var(--mono);font-weight:700;color:var(--premium-color);">Config ${k}:</span> <span style="font-size:12px;color:var(--text2);">${c.desc}</span></div>`).join(''):''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function saveRules(){
  DB.rules.minRetailValueDefault=parseFloat($('#r-minret').value)||20;
  DB.rules.maxMarketValueDefault=parseFloat($('#r-maxmkt').value)||200;
  DB.rules.lowStockThreshold=parseInt($('#r-lowstock').value)||20;
  DB.rules.criticalStockThreshold=parseInt($('#r-critical').value)||5;
  toast('Rules saved!','success');
}

function exportAllTemplates(){
  let csv='ID,Name,BoxType,PkgSize,Config,Status,SalePrice,MinRetail,MaxMarket,BuildableNow\n';
  DB.templates.forEach(t=>{
    const {count}=calcBuildable(t);
    csv+=`${t.id},"${t.name}",${t.boxType},"${BOX_TYPES[t.boxType]?.pkgSize||''}",${t.premiumConfig||''},${t.status},${t.salePrice.toFixed(2)},${t.minRetailValue.toFixed(2)},${t.maxMarketValue.toFixed(2)},${count}\n`;
  });
  dlCSV(csv,'box-templates.csv'); toast('Templates exported','success');
}

function exportHistoryCSV(){
  let csv='Timestamp,Type,Message\n';
  DB.history.forEach(h=>{csv+=`"${new Date(h.ts).toLocaleString()}",${h.type},"${h.msg}"\n`;});
  dlCSV(csv,'history-log.csv'); toast('History exported','success');
}

// ═══════════════════════════════════════
// HISTORY
// ═══════════════════════════════════════
function renderHistory(){
  const icons={add:'➕',remove:'➖',approve:'✅',pack:'📦'};
  const typeMap={add:'log-add',remove:'log-remove',approve:'log-approve',pack:'log-pack'};
  $('#topbar-actions').innerHTML=`<button class="btn btn-secondary btn-sm" onclick="exportHistoryCSV()">↓ Export</button>`;
  $('#content').innerHTML=`
    <div class="card">
      <div class="card-header"><div class="card-title">Audit History</div><div style="font-size:11px;color:var(--text3);font-family:var(--mono);">${DB.history.length} entries</div></div>
      <div class="card-body">
        <div class="log-list">
          ${DB.history.map(h=>`
            <div class="log-item ${typeMap[h.type]||''}">
              <div style="font-size:16px;">${icons[h.type]||'🔸'}</div>
              <div style="flex:1;"><div class="log-msg">${h.msg}</div><div class="log-time">${new Date(h.ts).toLocaleString()}</div></div>
            </div>`).join('')||'<div class="empty-state"><div class="empty-icon">🕐</div><div class="empty-title">No history yet</div></div>'}
        </div>
      </div>
    </div>`;
}

// ═══════════════════════════════════════
// REPORTS
// ═══════════════════════════════════════
function renderReports(){
  const totalRetail=DB.inventory.reduce((s,i)=>s+i.cost*i.qty,0);
  const totalMarket=DB.inventory.reduce((s,i)=>s+i.market*i.qty,0);
  const gain=totalMarket-totalRetail;
  const gainPct=((gain/totalRetail)*100).toFixed(1);

  const byCat={};
  DB.inventory.forEach(i=>{
    if(!byCat[i.category])byCat[i.category]={retail:0,market:0,qty:0,skus:0};
    byCat[i.category].retail+=i.cost*i.qty; byCat[i.category].market+=i.market*i.qty;
    byCat[i.category].qty+=i.qty; byCat[i.category].skus++;
  });

  const boxRows=DB.templates.map(t=>{
    const {retail,market}=calcBoxValues(t);
    const {count}=calcBuildable(t);
    const margin=t.salePrice-retail;
    const pct=retail>0?((margin/retail)*100).toFixed(1):'0.0';
    return `<tr>
      <td style="font-weight:600;">${t.name}</td>
      <td>${boxTypeTag(t.boxType)}</td>
      <td class="td-mono">${fmtMoney(retail)}</td>
      <td class="td-mono" style="color:var(--purple);">${fmtMoney(market)}</td>
      <td class="td-mono">${fmtMoney(t.salePrice)}</td>
      <td class="td-mono" style="color:${margin>=0?'var(--green)':'var(--red)'};">${fmtMoney(margin)} (${pct}%)</td>
      <td class="td-mono ${count>=15?'cap-high':count>=5?'cap-med':'cap-low'}">${count}</td>
    </tr>`;
  }).join('');

  const catRows=Object.entries(byCat).map(([cat,d])=>`<tr>
    <td style="font-weight:600;">${cat}</td>
    <td class="td-mono">${d.skus}</td>
    <td class="td-mono">${d.qty.toLocaleString()}</td>
    <td class="td-mono">${fmtMoney(d.retail)}</td>
    <td class="td-mono" style="color:var(--purple);">${fmtMoney(d.market)}</td>
  </tr>`).join('');

  const topItems=[...DB.inventory].sort((a,b)=>b.qty-a.qty).slice(0,8);
  const maxQ=Math.max(...topItems.map(i=>i.qty));
  const barColors=['var(--starter-color)','var(--deluxe-color)','var(--premium-color)','var(--collector-color)','var(--teal)','var(--accent)','var(--purple)','var(--red)'];
  const bars=topItems.map((item,i)=>`<div class="bar-chart-bar" style="height:${Math.max(10,Math.round((item.qty/maxQ)*108))}px;background:${barColors[i%barColors.length]};" title="${item.name}: ${item.qty}"></div>`).join('');

  $('#topbar-actions').innerHTML=`<button class="btn btn-secondary btn-sm" onclick="exportAllTemplates()">↓ Export Report</button>`;
  $('#content').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card c-teal"><div class="stat-icon">💼</div><div class="stat-label">Inventory Cost</div><div class="stat-value">${fmtMoney(totalRetail)}</div><div class="stat-sub">Purchase basis</div></div>
      <div class="stat-card c-purple"><div class="stat-icon">📈</div><div class="stat-label">Market Portfolio</div><div class="stat-value">${fmtMoney(totalMarket)}</div><div class="stat-sub">TCGplayer est.</div></div>
      <div class="stat-card ${parseFloat(gainPct)>=0?'c-green':'c-red'}"><div class="stat-icon">💹</div><div class="stat-label">Unrealized Gain</div><div class="stat-value">${fmtMoney(gain)}</div><div class="stat-sub">${gainPct}% over cost</div></div>
    </div>
    <div class="grid-2" style="margin-bottom:20px;">
      <div class="card">
        <div class="card-header"><div class="card-title">Top SKUs by Quantity</div></div>
        <div class="card-body" style="padding-bottom:0;">
          <div class="chart-placeholder">${bars}</div>
          <div style="font-size:10px;color:var(--text3);font-family:var(--mono);padding:6px 0;text-align:center;">Hover bars for item detail</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Category Breakdown</div></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Category</th><th>SKUs</th><th>Qty</th><th>Cost</th><th>Market</th></tr></thead>
            <tbody>${catRows}</tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Box Margin Analysis</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Template</th><th>Type</th><th>Retail</th><th>Market</th><th>Sale Price</th><th>Margin</th><th>Buildable</th></tr></thead>
          <tbody>${boxRows}</tbody>
        </table>
      </div>
    </div>`;
}

// INIT
navigate('dashboard');
</script>
</body>
</html>
